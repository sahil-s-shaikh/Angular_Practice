
<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Role</th>
<th>Department</th>
<th>Salary</th>
<th>Action</th>
</tr>

</thead>

<tbody>
@for ( emp of employees; track $index) {
<tr>

<td>{{emp.id}}</td>
<td>{{emp.name}}</td>
<td>{{emp.role}}</td>
<td>{{emp.department}}</td>
<td>{{emp.salary}}</td>
<td>

<button class="btn btn-danger" (click)="Empdel($index)">Delete</button>
</td>
}

</tbody>

</table>
