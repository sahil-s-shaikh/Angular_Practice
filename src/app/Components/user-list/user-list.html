<h3 class="text-center">User list</h3>
<div class="container">
    <div class="row">
        @for(user of userArr ; track $index){
            <div class="col-sm-3">
                <div class="card" >
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmEBXE8_aS0EU42pGKjChicsaeF0W53VKLEw&s" class="card-img-top" alt="...">
  <div class="card-body- text-center">
    <h5 class="card-title">{{user.name}}</h5>
    <p class="card-text">{{user.username}}</p>
     <p class="card-text">{{user.email}}</p>
      <p class="card-text">{{user.phone}}</p>
       <p class="card-text">{{user.address.city}}</p>
    <button class="btn btn-primary" [routerLink]="['/user-details',user.id]">Details</button>
  </div>
</div>
            </div>
        }
    </div>
</div>
