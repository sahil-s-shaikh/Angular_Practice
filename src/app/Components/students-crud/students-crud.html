<select [(ngModel)]="selected" (change)="changeData()">

    <option value="all">
        All Students
    </option>

    <option value="Bcs">
        Bcs Students
    </option>

    <option value="Bca">
       Bca Students
    </option>
    </select>
<table class="table table-bordered">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Class</th>
        <th>Gender</th>
       
    </tr>
    @for (std of students; track std.Id) {

        <tr>
            <td>{{std.Id}}</td>
            <td>{{std.name}}</td>
              <td>{{std.class}}</td>
            <td>{{std.Gender}}</td>
           
        </tr>
    }
</table>
